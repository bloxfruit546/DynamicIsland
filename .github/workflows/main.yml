name: Build DynamicIsland Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb package
    runs-on: macos-14
    
    env:
      THEOS: ${{ github.workspace }}/theos
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source code
        run: |
          mkdir -p $GITHUB_WORKSPACE/build_src
          if [ -f "$GITHUB_WORKSPACE/DynamicIsland_clean.zip" ]; then
            unzip -o "$GITHUB_WORKSPACE/DynamicIsland_clean.zip" -d $GITHUB_WORKSPACE/build_src
          elif [ -f "$GITHUB_WORKSPACE/DynamicIsland.zip" ]; then
            unzip -o "$GITHUB_WORKSPACE/DynamicIsland.zip" -d $GITHUB_WORKSPACE/build_src
          else
            echo "ERROR: Please upload DynamicIsland_clean.zip to your repository root!"
            exit 1
          fi
          chmod -R 0755 $GITHUB_WORKSPACE/build_src/layout/DEBIAN || true
          ls -la $GITHUB_WORKSPACE/build_src

      - name: Install Theos & SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build package
        run: |
          cd $GITHUB_WORKSPACE/build_src
          make clean
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-deb
          path: build_src/packages/*.deb
          if-no-files-found: error
          retention-days: 30
