      - name: Build DynamicIsland package
        working-directory: build_src
        run: make package FINALPACKAGE=1
        env:
          THEOS: ${{ env.THEOS }}

      - name: Collect .deb output
        run: |
          mkdir -p deb_output
          find build_src -name '*.deb' -exec cp {} deb_output/ \;
          ls -la deb_output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-v3.0-deb
          path: deb_output/*.deb
          if-no-files-found: error
