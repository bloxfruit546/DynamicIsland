          cat > /tmp/decode_di.py << 'PYEOF'
          import base64, zipfile, io, os
          with open('/tmp/di_src.b64') as f:
              raw_b64 = f.read().replace('\n', '').replace(' ', '')
          data = base64.b64decode(raw_b64)
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              z.extractall('build_src')
          print('Extracted:', len(os.listdir('build_src')), 'items')
          PYEOF
          python3 /tmp/decode_di.py

      - name: Fix script permissions for dpkg
        run: |
          chmod -R 0755 build_src/layout/DEBIAN 2>/dev/null || true
          find build_src -type f -name "postinst" -exec chmod 0755 {} +
          find build_src -type f -name "prerm" -exec chmod 0755 {} +
          find build_src -type f -name "postrm" -exec chmod 0755 {} +
          find build_src -type f -name "preinst" -exec chmod 0755 {} +
          chmod 0644 build_src/layout/DEBIAN/control 2>/dev/null || true
          ls -la build_src/layout/DEBIAN/ || true

      - name: Build DynamicIsland package
        working-directory: build_src
        run: make package FINALPACKAGE=1
        env:
          THEOS: ${{ env.THEOS }}

      - name: Collect .deb output
        run: |
          mkdir -p deb_output
          find build_src -name '*.deb' -exec cp {} deb_output/ \;
          ls -la deb_output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-v3.0-deb
          path: deb_output/*.deb
          if-no-files-found: error
