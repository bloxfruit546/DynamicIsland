name: Build DynamicIsland Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb package
    runs-on: macos-14
    
    env:
      THEOS: ${{ github.workspace }}/theos
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Theos & SDKs
        run: |
          rm -rf $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build package
        run: |
          if [ -d "DynamicIsland" ]; then
            cd DynamicIsland
          fi
          
          cat << 'EOF' > Makefile
          export ARCHS = arm64
          export TARGET = iphone:clang:14.5:12.0

          INSTALL_TARGET_PROCESSES = SpringBoard

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = DynamicIsland

          DynamicIsland_FILES = \
          	Tweak.xm \
          	src/DIWindowController.m \
          	src/DynamicIslandView.m \
          	src/DICompactView.m \
          	src/DIExpandedView.m \
          	src/DIActivityManager.m \
          	src/DIAnimator.m \
          	src/DINotificationProvider.m \
          	src/DIMusicProvider.m \
          	src/DICallProvider.m \
          	src/DIPreferencesManager.m

          DynamicIsland_CFLAGS = -fobjc-arc -Isrc -w
          DynamicIsland_FRAMEWORKS = UIKit CoreGraphics QuartzCore MediaPlayer CoreTelephony

          include $(THEOS_MAKE_PATH)/tweak.mk

          SUBPROJECTS += PreferenceBundle
          include $(THEOS_MAKE_PATH)/aggregate.mk
          EOF

          mkdir -p PreferenceBundle
          cat << 'EOF' > PreferenceBundle/Makefile
          include $(THEOS)/makefiles/common.mk

          BUNDLE_NAME = DynamicIslandPrefs

          DynamicIslandPrefs_FILES = DynamicIslandPrefsController.m
          DynamicIslandPrefs_INSTALL_PATH = /Library/PreferenceBundles
          DynamicIslandPrefs_FRAMEWORKS = UIKit
          DynamicIslandPrefs_PRIVATE_FRAMEWORKS = Preferences
          DynamicIslandPrefs_CFLAGS = -fobjc-arc

          include $(THEOS_MAKE_PATH)/bundle.mk
          EOF

          make clean
          make package FINALPACKAGE=1

      - name: List built packages
        run: |
          ls -la packages/ 2>/dev/null || ls -la DynamicIsland/packages/ 2>/dev/null || ls -la .theos/packages/ 2>/dev/null || true

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-deb
          path: |
            packages/*.deb
            DynamicIsland/packages/*.deb
            .theos/packages/*.deb
            DynamicIsland/.theos/packages/*.deb
          if-no-files-found: error
          retention-days: 30
