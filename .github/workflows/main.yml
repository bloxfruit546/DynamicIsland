name: Build DynamicIsland Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build .deb package
    runs-on: macos-14
    
    env:
      THEOS: ${{ github.workspace }}/theos
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract full verified source
        run: |
          mkdir -p $GITHUB_WORKSPACE/build_src
          cd $GITHUB_WORKSPACE/build_src
          cat << 'EOF' > source.b64

EOF
          python3 -c "import base64; open('source.zip', 'wb').write(base64.b64decode(open('source.b64').read()))"
          unzip -o source.zip
          ls -la

      - name: Install Theos & Patched SDKs
        run: |
          rm -rf $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build package
        run: |
          cd $GITHUB_WORKSPACE/build_src
          make clean
          make package FINALPACKAGE=1

      - name: List built packages
        run: |
          ls -la $GITHUB_WORKSPACE/build_src/packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-deb
          path: build_src/packages/*.deb
          if-no-files-found: error
          retention-days: 30
