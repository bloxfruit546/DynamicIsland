name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
      - run: brew install dpkg ldid
      - run: unzip -o DynamicIsland_clean.zip -d build_src && chmod -R 755 build_src/layout/DEBIAN || true
      - run: git clone --recursive https://github.com/theos/theos.git $THEOS && rm -rf $THEOS/sdks && git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
      - run: cd build_src && make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-deb
          path: build_src/packages/*.deb
