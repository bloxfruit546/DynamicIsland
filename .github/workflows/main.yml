name: Build DynamicIsland Tweak v3.0

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install required tools
        run: |
          brew install ldid dpkg
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          git clone https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -r /tmp/theos-sdks/iPhoneOS*.sdk $THEOS/sdks/ 2>/dev/null || true
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Embed and extract source
