          with open('build_src/source.zip', 'wb') as f:
              f.write(raw_bytes)
          with zipfile.ZipFile('build_src/source.zip', 'r') as zf:
              for member in zf.infolist():
                  zf.extract(member, 'build_src')
                  if 'postinst' in member.filename:
                      os.chmod(os.path.join('build_src', member.filename), 0o755)
          print('Extracted', len(os.listdir('build_src')), 'items successfully')

      - name: Install Theos & Patched SDKs
        run: |
          rm -rf $THEOS
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks

      - name: Build package
        run: |
          cd $GITHUB_WORKSPACE/build_src
          make clean
          make package FINALPACKAGE=1

      - name: List built packages
        run: |
          ls -la $GITHUB_WORKSPACE/build_src/packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-deb
          path: build_src/packages/*.deb
          if-no-files-found: error
          retention-days: 30
